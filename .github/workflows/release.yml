name: release

# Push a tag like v0.3.0 to build Windows, macOS and Linux executables and
# attach them to a GitHub release. "Run workflow" on the Actions tab builds
# without releasing (the binaries are kept as workflow artifacts).
#
# PyPI: the `pypi` job runs only when the repository variable PYPI_PUBLISH is
# "true" (Settings -> Secrets and variables -> Actions -> Variables), after the
# trusted publisher is registered on pypi.org. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]  # oldest glibc = widest Linux support
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pyinstaller
      - name: Tests
        # one retry: a rare UI-test hang on Windows runners should not sink a release
        run: pytest -q || pytest -q
        timeout-minutes: 10
      - name: Build
        run: python packaging/build.py
      - name: Self-test the executable
        shell: bash
        run: |
          exe=$(ls dist/slsk-reborn-*)
          "$exe" --version
          "$exe" --self-test
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: dist/slsk-reborn-*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir pkg
          twine check pkg/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: pkg/*

  release:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "slsk-reborn $GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/slsk-reborn
    permissions:
      id-token: write  # trusted publishing, no token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: pkg
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg
