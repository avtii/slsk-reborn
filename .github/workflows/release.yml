name: release

# Push a tag like v0.2.0 to build Windows and macOS executables and attach
# them to a GitHub release. "Run workflow" on the Actions tab builds without
# releasing (the binaries are kept as workflow artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pyinstaller
      - name: Tests
        run: pytest -q
      - name: Build
        run: python packaging/build.py
      - name: Self-test the executable
        shell: bash
        run: |
          exe=$(ls dist/slsk-reborn-*)
          "$exe" --version
          "$exe" --self-test
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}
          path: dist/slsk-reborn-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "slsk-reborn $GITHUB_REF_NAME" --generate-notes
